# Los secretos se leen de variables de entorno (o de application-local.properties,
# que esta en .gitignore y se activa por defecto con el perfil "local").
spring.application.name=ms_security
server.port=8181
spring.profiles.default=local

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/security_ms_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Servicio de notificaciones (envio de correos: 2FA y recuperacion de contrasena)
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:5000/send-email}

security.jwt.secret=${JWT_SECRET}

google.oauth.client-id=${GOOGLE_CLIENT_ID}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET}

github.oauth.client-id=${GITHUB_CLIENT_ID}
github.oauth.client-secret=${GITHUB_CLIENT_SECRET}

# Rol que se asigna a quien se registra o entra por OAuth
security.default-role=AFICIONADO

# Si esta vacio NO se crea el usuario admin semilla
security.seed.admin-email=${SEED_ADMIN_EMAIL:admin@uc.edu.co}
security.seed.admin-password=${SEED_ADMIN_PASSWORD:}
